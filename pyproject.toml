[project]
name = "opengl-web-ide"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.163", "uvicorn>=0.54", "websockets>=13"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28"]
stream = ["aiortc>=1.16"]  # tarayıcıda görüntü (ADR-018), ~100 MB

[build-system]
requires = ["setuptools>=84.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "native: MSYS2 toolchain ve GPU gerektirir (yoksa atlanır)",
]
